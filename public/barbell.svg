<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Diagonal barbell</title>
  <desc id="desc">A chunky barbell tilted from the lower left to the upper right.</desc>
  <defs>
    <linearGradient id="barbell-fill" x1="106" y1="360" x2="407" y2="143" gradientUnits="userSpaceOnUse">
      <stop stop-color="#aab8dd"/>
      <stop offset="1" stop-color="#eef3ff"/>
    </linearGradient>
    <filter id="barbell-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#07194d" flood-opacity=".28"/>
    </filter>
  </defs>

  <g transform="rotate(-45 256 256)" filter="url(#barbell-shadow)" fill="url(#barbell-fill)" stroke="#f7f9ff" stroke-opacity=".58" stroke-width="8" stroke-linejoin="round">
    <!-- shaft -->
    <rect x="112" y="240" width="288" height="32" rx="14"/>

    <!-- left weight stack -->
    <rect x="94" y="218" width="38" height="76" rx="12"/>
    <path d="M70 181c0-12 10-22 22-22h22c12 0 22 10 22 22v150c0 12-10 22-22 22H92c-12 0-22-10-22-22v-32c17 1 28-10 28-24 0-13-11-24-28-23v-72z"/>
    <path d="M30 172c0-13 11-24 24-24h13c13 0 24 11 24 24v168c0 13-11 24-24 24H54c-13 0-24-11-24-24v-38c18 2 31-10 31-25 0-16-13-28-31-26v-79z"/>
    <rect x="12" y="219" width="34" height="74" rx="17"/>

    <!-- right weight stack -->
    <rect x="380" y="218" width="38" height="76" rx="12"/>
    <path d="M376 181c0-12 10-22 22-22h22c12 0 22 10 22 22v71c-17-1-28 10-28 24 0 13 11 24 28 23v32c0 12-10 22-22 22h-22c-12 0-22-10-22-22V181z"/>
    <path d="M421 172c0-13 11-24 24-24h13c13 0 24 11 24 24v79c-18-2-31 10-31 26 0 15 13 27 31 25v38c0 13-11 24-24 24h-13c-13 0-24-11-24-24V172z"/>
    <rect x="466" y="219" width="34" height="74" rx="17"/>
  </g>
</svg>
